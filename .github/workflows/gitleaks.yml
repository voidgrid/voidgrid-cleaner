name: gitleaks

# Scans the whole history on every push (any branch or tag) and every pull
# request, so a push from a machine without the local hooks is still checked.
# Same gitleaks version as .pre-commit-config.yaml; the image comes from
# ghcr.io, so no Docker Hub pull.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo
